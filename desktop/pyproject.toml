[project]
name = "whisper-dictate"
version = "0.1.0"
description = "Hotkey dictation for Linux: record, transcribe via an OpenAI-compatible Whisper API, transcript to clipboard."
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "numpy>=1.26",
    "requests>=2.31",
    "webrtcvad-wheels>=2.0.14",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[project.scripts]
whisper-dictate = "whisper_dictate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
